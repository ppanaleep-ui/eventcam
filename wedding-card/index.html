<title>Panalee &amp; Saharat</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Parisienne&family=Sarabun:wght@300;400;600&display=swap">
<style>
  :root{
    --ground-1:#fbf8f3;
    --ground-2:#e6e0d5;
    --ground-3:#d7d1c4;
    --ink:#4b4640;
    --ink-soft:#786f63;
    --olive:#5d6a4e;
    --rose:#c78ea4;
    --rose-deep:#a8687f;
    --shadow:rgba(72,64,52,.3);

    --cw:min(340px,82vw);
    --ch:calc(var(--cw) * 1.4005);   /* the printed panel, 764 : 1070 */
    --ew:min(430px,92vw);
    --eh:calc(var(--ew) * .7232);    /* the envelope, 1503 : 1087 */

    --f-script:"Parisienne","Snell Roundhand",cursive;
    --f-serif:"Cormorant Garamond",Georgia,serif;
    --f-thai:"Sarabun",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html{color-scheme:light}
  p{margin:0}
  [hidden]{display:none!important}
  img{max-width:100%;display:block}

  body{
    margin:0;
    background:radial-gradient(130% 100% at 50% 0%,var(--ground-1) 0%,var(--ground-2) 58%,var(--ground-3) 100%);
    background-attachment:fixed;
    color:var(--ink);
    font-family:var(--f-thai);
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }

  canvas#petals{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:60}

  .stage{
    min-height:100svh;
    display:grid;place-items:center;
    padding:22px 16px 28px;
    padding-block-start:calc(22px + env(safe-area-inset-top,0px));
  }
  body.scene-inside .stage{min-height:auto;padding-block:26px 6px}

  .scene{display:grid;place-items:center;gap:20px;width:100%}

  .hint{
    display:flex;align-items:center;gap:9px;
    font-size:.92rem;letter-spacing:.03em;color:var(--ink-soft);
    animation:breathe 2.7s ease-in-out infinite;
  }
  .hint b{font-weight:600;color:var(--olive)}
  .hint em{font-family:var(--f-serif);font-style:italic;letter-spacing:.08em}
  @keyframes breathe{0%,100%{opacity:.6;transform:translateY(0)}50%{opacity:1;transform:translateY(-3px)}}

  /* ───────────────────── scene 1 · the envelope ───────────────────── */
  #scene-env{transition:opacity .55s ease,transform .7s cubic-bezier(.4,0,.6,1)}
  body.env-gone #scene-env{opacity:0;transform:scale(.88);pointer-events:none}

  .envelope{
    position:relative;
    width:var(--ew);height:var(--eh);
    border:0;padding:0;background:none;cursor:pointer;
    perspective:1100px;
    filter:drop-shadow(0 26px 34px rgba(72,64,52,.28));
  }
  .envelope:focus-visible{outline:2px solid var(--rose-deep);outline-offset:16px;border-radius:8px}
  .env-body{position:absolute;inset:0;width:100%;height:100%;z-index:4;border-radius:3px}

  .env-card{
    position:absolute;left:8.5%;top:4%;width:83%;
    z-index:3;
    border-radius:2px;
    box-shadow:0 -12px 26px -14px var(--shadow);
    transform:translateY(16%) scale(.995);
    transition:transform 1s cubic-bezier(.32,.86,.3,1) .18s;
  }
  body.env-open .env-card{transform:translateY(-58%)}

  .env-flap{
    position:absolute;left:0;top:0;width:100%;height:58.6%;
    transform-origin:top center;
    transform-style:preserve-3d;
    z-index:5;
  }
  .env-flap i{position:absolute;inset:0;backface-visibility:hidden;display:block}
  .env-flap i img{width:100%;height:100%}
  .env-flap i.back{
    transform:rotateX(180deg);
    background:linear-gradient(180deg,#f7f1e3,#efe7d4 62%,#e4dbc6);
    clip-path:polygon(0 0,100% 0,100% 26.7%,50% 100%,0 26.7%);
  }
  body.env-open .env-flap{animation:flapOpen 1.05s cubic-bezier(.55,.06,.3,1) forwards}
  @keyframes flapOpen{
    0%{transform:rotateX(0deg);z-index:5}
    49.9%{z-index:5}
    50%{z-index:2}
    100%{transform:rotateX(-171deg);z-index:2}
  }

  /* ───────────────────── scene 2 + 3 · the card ───────────────────── */
  #scene-card{animation:cardArrive 1s cubic-bezier(.24,.9,.3,1) backwards}
  @keyframes cardArrive{from{opacity:0;transform:translateY(26px) scale(.84)}to{opacity:1;transform:none}}

  .shell{
    position:relative;
    width:var(--cw);
    perspective:2000px;
  }
  @media (min-width:880px){
    :root{--cw:400px}
    body.card-open .shell{width:calc(var(--cw) * 2)}
  }
  .shell{transition:width 1.2s cubic-bezier(.5,.05,.25,1)}

  .spread{
    display:grid;grid-template-columns:1fr;
    width:100%;
    height:var(--ch);overflow:hidden;
    opacity:0;
    transition:opacity .75s ease .48s;
    box-shadow:0 30px 54px -26px var(--shadow);
  }
  body.card-open .spread{opacity:1;height:auto;overflow:visible}
  @media (min-width:880px){
    body.card-open .spread{grid-template-columns:1fr 1fr}
  }
  .spread img{width:100%;height:auto}
  .spread img + img{box-shadow:16px 0 26px -24px rgba(72,64,52,.7) inset}

  .cover{
    position:absolute;top:0;right:0;
    width:var(--cw);height:var(--ch);
    border:0;padding:0;background:none;cursor:pointer;
    transform-origin:left center;
    transform-style:preserve-3d;
    transform:rotateY(0deg);
    transition:transform 1.2s cubic-bezier(.5,.05,.25,1),opacity .35s ease .95s;
    z-index:4;
  }
  .cover:focus-visible{outline:2px solid var(--rose-deep);outline-offset:14px}
  body.card-open .cover{transform:rotateY(-179deg);opacity:0;pointer-events:none}

  .face{
    position:absolute;inset:0;
    backface-visibility:hidden;
    overflow:hidden;
    box-shadow:0 30px 50px -24px var(--shadow);
  }
  .face img.paper{width:100%;height:100%}
  .face.back{transform:rotateY(180deg)}

  /* the paper lily that comes laid over the card */
  .lily{
    position:absolute;left:-19%;bottom:-19%;width:93%;height:auto;
    transform-origin:26% 88%;
    transform:scale(.24) rotate(-26deg);
    opacity:0;
    filter:drop-shadow(0 10px 14px rgba(150,110,125,.3));
    pointer-events:none;
  }
  body.scene-cover .lily{animation:bloom 1.5s cubic-bezier(.2,.86,.3,1) .35s forwards}
  @keyframes bloom{
    0%{transform:scale(.24) rotate(-26deg);opacity:0}
    45%{opacity:1}
    100%{transform:scale(1) rotate(0deg);opacity:1}
  }

  /* ───────────────────── the bits paper can't do ───────────────────── */
  .countdown{display:flex;gap:clamp(16px,5vw,30px);justify-content:center;align-items:baseline}
  .cd{display:grid;justify-items:center;gap:3px}
  .cd b{
    font-size:clamp(1.4rem,5.6vw,1.8rem);font-weight:400;color:var(--olive);line-height:1;
    font-variant-numeric:lining-nums tabular-nums;
  }
  .cd span{font-size:.7rem;letter-spacing:.08em;color:var(--ink-soft)}

  .tools{
    display:flex;flex-wrap:wrap;gap:10px;justify-content:center;
    padding:2px 0 max(16px,env(safe-area-inset-bottom,0px));
  }
  .btn{
    display:inline-flex;align-items:center;gap:8px;
    font-family:var(--f-thai);font-size:.86rem;color:var(--olive);
    background:rgba(255,255,255,.66);
    border:1px solid rgba(93,106,78,.26);
    border-radius:999px;padding:9px 16px;
    text-decoration:none;cursor:pointer;
    transition:background .2s ease,border-color .2s ease,transform .2s ease;
  }
  .btn:hover{background:#fff;border-color:rgba(93,106,78,.5);transform:translateY(-1px)}
  .btn:focus-visible{outline:2px solid var(--rose-deep);outline-offset:3px}
  .btn svg{width:16px;height:16px;flex:none}

  .toast{
    position:fixed;left:50%;bottom:26px;transform:translate(-50%,16px);
    background:rgba(75,70,64,.94);color:#fbf7f0;
    font-size:.82rem;padding:9px 16px;border-radius:999px;
    opacity:0;pointer-events:none;transition:opacity .3s ease,transform .3s ease;
    z-index:80;
  }
  .toast.on{opacity:1;transform:translate(-50%,0)}

  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.15s!important}
    .lily{transform:none;opacity:1}
  }
</style>

<canvas id="petals" aria-hidden="true"></canvas>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<main class="stage">
  <section class="scene" id="scene-env">
    <button class="envelope" id="envelope" aria-label="เปิดซองจดหมาย การ์ดแต่งงาน ปณาลี และ สหรัฐ">
      <img class="env-card" src="art/cover-front.webp" alt="" aria-hidden="true">
      <img class="env-body" src="art/env-body.webp" alt="ซองจดหมายเชิญ ปิดผนึกด้วยครั่งอักษร P และ S">
      <span class="env-flap">
        <i class="front"><img src="art/env-flap.webp" alt=""></i>
        <i class="back"></i>
      </span>
    </button>
    <p class="hint"><b>แตะเพื่อเปิดซอง</b> · <em>The Wedding Invitation</em></p>
  </section>

  <section class="scene" id="scene-card" hidden>
    <div class="shell" id="shell">
      <div class="spread" id="spread">
        <img src="art/inside-left.webp" alt="คำเชิญ: ฮัจญี ดร.ธงชัย ปิติเศรษฐ และ ฮัจญะฮ์ ผุสดี ปิติเศรษฐ, นาย ภูริพัทธ์ พึ่งและ และ นาง โสภา หวง มีความยินดีขอเรียนเชิญร่วมงานพิธีนิกะห์และวาลีมะฮ์ ของ ปณาลี (สุรอยญา) ปิติเศรษฐ และ สหรัฐ (ฟาฮัต) พึ่งและ วันอาทิตย์ที่ 13 ธันวาคม 2569 ณ มูนสตาร์ คอนเวนชั่น ฮอลล์">
        <img src="art/inside-right.webp" alt="กำหนดการ: 11.00 น. พิธีนิกะฮ์, 11.20 น. พิธีสวมแหวน, 11.30 น. รับประทานอาหาร, 11.45 น. กล่าวอวยพรเจ้าบ่าวเจ้าสาว, 13.00 น. งานเลี้ยงฉลองมงคลสมรส (วาลีมะฮ์), 14.00 น. ถ่ายภาพร่วมกับเจ้าบ่าวเจ้าสาว, 16.00 น. จบงาน">
      </div>
      <button class="cover" id="cover" aria-label="เปิดการ์ด อ่านรายละเอียดงาน">
        <span class="face front">
          <img class="paper" src="art/cover-front.webp" alt="The Wedding · Panalee &amp; Saharat · #FaFonPorjai">
          <img class="lily" src="art/lily.webp" alt="" aria-hidden="true">
        </span>
        <span class="face back">
          <img class="paper" src="art/cover-back.webp" alt="">
        </span>
      </button>
    </div>

    <p class="hint" id="cover-hint"><b>แตะที่การ์ดเพื่อเปิด</b></p>

    <div class="countdown" id="countdown" hidden aria-label="นับถอยหลังสู่วันงาน"></div>

    <div class="tools" id="tools" hidden>
      <a class="btn" id="btn-map" href="#" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M12 21.5s7-6.2 7-11.5a7 7 0 1 0-14 0c0 5.3 7 11.5 7 11.5Z"/><circle cx="12" cy="10" r="2.6"/></svg>
        แผนที่งาน
      </a>
      <a class="btn" id="btn-cal" href="#" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
        บันทึกลงปฏิทิน
      </a>
      <button class="btn" id="btn-share">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 10.6 15.4 6.6M8.6 13.4l6.8 4"/></svg>
        ส่งการ์ดให้เพื่อน
      </button>
      <button class="btn" id="btn-replay">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 4v5h-5"/></svg>
        ชมอีกครั้ง
      </button>
    </div>
  </section>
</main>

<script>
(function(){
  "use strict";
  var RM = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* ── petals, so the card arrives the way flowers do ── */
  var cv = document.getElementById("petals"), ctx = cv.getContext("2d"), W = 0, H = 0;
  var TONES = ["#eec3d1", "#e3a8bc", "#f5dde4", "#e7d2d9"], petals = [];

  function resize(){
    var d = Math.min(window.devicePixelRatio || 1, 2);
    W = cv.clientWidth; H = cv.clientHeight;
    cv.width = W * d; cv.height = H * d;
    ctx.setTransform(d, 0, 0, d, 0, 0);
  }
  window.addEventListener("resize", resize);
  resize();

  function mk(x, y, isBurst){
    var a = Math.random() * Math.PI * 2, sp = isBurst ? 2.4 + Math.random() * 5 : 0;
    return {
      x: x, y: y,
      vx: isBurst ? Math.cos(a) * sp : (Math.random() - .5) * .34,
      vy: isBurst ? Math.sin(a) * sp - 1.5 : .32 + Math.random() * .5,
      s: .34 + Math.random() * .54,
      rot: Math.random() * 6.3, vr: (Math.random() - .5) * .055,
      sway: Math.random() * 6.3,
      op: isBurst ? .9 : .15 + Math.random() * .28,
      fall: isBurst ? .006 : 0,
      tone: TONES[(Math.random() * TONES.length) | 0]
    };
  }
  if (!RM) for (var i = 0; i < 20; i++) petals.push(mk(Math.random() * W, Math.random() * H, false));
  function burst(x, y, n){ if (!RM) for (var i = 0; i < n; i++) petals.push(mk(x, y, true)); }

  (function draw(){
    ctx.clearRect(0, 0, W, H);
    for (var i = petals.length - 1; i >= 0; i--){
      var p = petals[i];
      p.sway += .02;
      p.x += p.vx + Math.sin(p.sway) * .48;
      p.y += p.vy;
      if (p.fall){ p.vy += .045; p.op -= p.fall; }
      p.vx *= .985; p.rot += p.vr;
      if (p.op <= 0 || p.y > H + 60){
        if (p.fall){ petals.splice(i, 1); continue; }
        p.y = -30; p.x = Math.random() * W;
      }
      ctx.save();
      ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.scale(p.s, p.s);
      ctx.globalAlpha = Math.max(0, Math.min(1, p.op));
      ctx.fillStyle = p.tone;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.bezierCurveTo(9, -9, 21, -4, 19, 6);
      ctx.bezierCurveTo(17, 15, 6, 18, 0, 11);
      ctx.bezierCurveTo(-4, 7, -4, 3, 0, 0);
      ctx.fill();
      ctx.restore();
    }
    requestAnimationFrame(draw);
  })();

  /* ── scenes ── */
  var body = document.body,
      sceneEnv = document.getElementById("scene-env"),
      sceneCard = document.getElementById("scene-card"),
      envelope = document.getElementById("envelope"),
      cover = document.getElementById("cover"),
      coverHint = document.getElementById("cover-hint"),
      tools = document.getElementById("tools"),
      cdEl = document.getElementById("countdown"),
      state = "env", t1, t2;

  function centerOf(el){
    var r = el.getBoundingClientRect();
    return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
  }

  envelope.addEventListener("click", function(){
    if (state !== "env") return;
    state = "cover";
    var c = centerOf(envelope);
    body.classList.add("env-open");
    burst(c.x, c.y + 12, 26);
    setTimeout(function(){ burst(c.x, c.y - 30, 18); }, RM ? 0 : 700);
    t1 = setTimeout(function(){
      body.classList.add("env-gone");
      setTimeout(function(){
        sceneEnv.hidden = true;
        sceneCard.hidden = false;
        body.classList.add("scene-cover");
        cover.focus({ preventScroll: true });
      }, RM ? 20 : 420);
    }, RM ? 60 : 1450);
  });

  cover.addEventListener("click", function(){
    if (state !== "cover") return;
    state = "inside";
    var c = centerOf(cover);
    body.classList.add("card-open", "scene-inside");
    coverHint.hidden = true;
    burst(c.x, c.y, 24);
    t2 = setTimeout(function(){
      tools.hidden = false;
      cdEl.hidden = false;
      if (window.innerWidth < 880){
        document.getElementById("spread").scrollIntoView({ behavior: RM ? "auto" : "smooth", block: "start" });
      }
    }, RM ? 60 : 1000);
  });

  document.getElementById("btn-replay").addEventListener("click", function(){
    clearTimeout(t1); clearTimeout(t2);
    state = "env";
    body.classList.remove("env-open", "env-gone", "scene-cover", "card-open", "scene-inside");
    sceneCard.hidden = true;
    sceneEnv.hidden = false;
    coverHint.hidden = false;
    tools.hidden = true;
    cdEl.hidden = true;
    window.scrollTo({ top: 0, behavior: RM ? "auto" : "smooth" });
    envelope.focus({ preventScroll: true });
  });

  /* ── the day itself ── */
  var WHEN = new Date("2026-12-13T11:00:00+07:00"),
      VENUE = "มูนสตาร์ คอนเวนชั่น ฮอลล์",
      TITLE = "งานแต่งงาน ปณาลี (สุรอยญา) & สหรัฐ (ฟาฮัต) #FaFonPorjai",
      mapUrl = "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent("Moonstar Convention Hall " + VENUE);

  document.getElementById("btn-map").href = mapUrl;
  document.getElementById("btn-cal").href =
    "https://calendar.google.com/calendar/render?action=TEMPLATE" +
    "&text=" + encodeURIComponent(TITLE) +
    "&dates=20261213T040000Z/20261213T090000Z" +
    "&location=" + encodeURIComponent(VENUE) +
    "&details=" + encodeURIComponent("พิธีนิกะฮ์ 11.00 น. · งานเลี้ยงฉลองมงคลสมรส (วาลีมะฮ์) 13.00 น.");

  (function tick(){
    var ms = WHEN - new Date();
    if (ms <= 0){
      cdEl.innerHTML = '<div class="cd"><b>วันนี้</b><span>คือวันของเรา</span></div>';
    } else {
      var d = Math.floor(ms / 864e5), h = Math.floor(ms / 36e5) % 24, m = Math.floor(ms / 6e4) % 60;
      cdEl.innerHTML =
        '<div class="cd"><b>' + d + '</b><span>วัน</span></div>' +
        '<div class="cd"><b>' + h + '</b><span>ชั่วโมง</span></div>' +
        '<div class="cd"><b>' + m + '</b><span>นาที</span></div>';
    }
    setTimeout(tick, 30000);
  })();

  /* ── pass the flowers on ── */
  var toast = document.getElementById("toast"), toastT;
  function say(msg){
    toast.textContent = msg; toast.classList.add("on");
    clearTimeout(toastT);
    toastT = setTimeout(function(){ toast.classList.remove("on"); }, 2600);
  }
  document.getElementById("btn-share").addEventListener("click", function(){
    var data = { title: TITLE, text: "ขอเรียนเชิญร่วมงานพิธีนิกะห์และวาลีมะฮ์ 13 ธันวาคม 2569", url: location.href };
    if (navigator.share) navigator.share(data).catch(function(){});
    else if (navigator.clipboard) navigator.clipboard.writeText(location.href).then(
      function(){ say("คัดลอกลิงก์การ์ดแล้ว ส่งต่อให้เพื่อนได้เลย"); },
      function(){ say("คัดลอกลิงก์ไม่สำเร็จ ลองคัดลอกจากแถบที่อยู่เว็บ"); });
    else say("คัดลอกลิงก์จากแถบที่อยู่เว็บเพื่อส่งต่อได้เลย");
  });
})();
</script>

# Full "real scale" stack: EventCam wired to Postgres + Redis + S3 (MinIO).
# This exercises exactly the horizontally-scalable path described in SCALING.md
# — stateless app, shared DB, cross-instance live updates, object storage.
#
#   docker compose up --build
#   open http://localhost:3000
#
# To simulate multiple app instances behind a load balancer, add an nginx/Caddy
# service and `docker compose up --scale app=3` (see DEPLOY.md).

services:
  app:
    build: .
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      PORT: 3000
      PUBLIC_URL: http://localhost:3000
      # Auth: set OWNER_EMAIL to your email, then register with it to become the
      # site owner (who approves other organizers). Use a long random JWT_SECRET.
      OWNER_EMAIL: maxatron.ss@gmail.com
      JWT_SECRET: change-me-to-a-long-random-string
      DATABASE_URL: postgres://eventcam:eventcam@db:5432/eventcam
      REDIS_URL: redis://redis:6379
      S3_BUCKET: eventcam
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_FORCE_PATH_STYLE: 'true'
      # The browser fetches photos from here (MinIO exposed on the host). In
      # production this is your CDN in front of the bucket.
      S3_PUBLIC_BASE: http://localhost:9000/eventcam
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      minio-setup:
        condition: service_completed_successfully
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: eventcam
      POSTGRES_PASSWORD: eventcam
      POSTGRES_DB: eventcam
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U eventcam']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - '9000:9000' # S3 API (also the photo public URL host)
      - '9001:9001' # MinIO web console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - miniodata:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot: create the bucket and make objects publicly readable so the
  # browser (and your CDN) can fetch photos directly.
  minio-setup:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/eventcam &&
      mc anonymous set download local/eventcam
      "

volumes:
  pgdata:
  miniodata:

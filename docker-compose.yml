# One-command run for PhotoWish (SQLite + a persistent volume).
#
#   1) cp .env.example .env   and edit SESSION_SECRET + NEXT_PUBLIC_APP_URL
#   2) docker compose up --build
#   3) open http://localhost:3000
#
# Data (SQLite DB + uploaded images) is kept in named volumes so it survives
# container restarts and rebuilds.

services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      # SQLite database lives on the "db" volume (mounted at /app/prisma/data).
      DATABASE_URL: "file:/app/prisma/data/prod.db"
      SESSION_SECRET: "${SESSION_SECRET:-please-change-me-to-a-long-random-string}"
      NEXT_PUBLIC_APP_URL: "${NEXT_PUBLIC_APP_URL:-http://localhost:3000}"
      SLIP_VERIFY_PROVIDER: "${SLIP_VERIFY_PROVIDER:-}"
      EASYSLIP_API_TOKEN: "${EASYSLIP_API_TOKEN:-}"
    volumes:
      - db:/app/prisma/data
      - uploads:/app/storage/uploads
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  db:
  uploads:
